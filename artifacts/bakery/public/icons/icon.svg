<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#f59e0b"/>
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Bread loaf shape -->
  <ellipse cx="256" cy="260" rx="148" ry="90" fill="#fff8e7" opacity="0.95"/>
  <ellipse cx="256" cy="240" rx="130" ry="80" fill="#fef3c7"/>
  <!-- Top crust dome -->
  <path d="M128 240 Q256 120 384 240" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
  <path d="M128 240 Q256 128 384 240" fill="#fef3c7"/>
  <!-- Score lines on bread -->
  <line x1="200" y1="175" x2="215" y2="240" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="162" x2="256" y2="232" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="312" y1="175" x2="297" y2="240" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom loaf -->
  <rect x="128" y="240" width="256" height="80" rx="40" fill="#fbbf24"/>
  <!-- Shine -->
  <ellipse cx="220" cy="190" rx="30" ry="14" fill="white" opacity="0.25" transform="rotate(-20, 220, 190)"/>
  <!-- Small text -->
  <text x="256" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white" opacity="0.9">ARA</text>
</svg>
